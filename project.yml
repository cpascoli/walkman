name: YouTubePlayer
options:
  bundleIdPrefix: com.carlopascoli
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    exactVersion: 0.4.9

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7DZ8FR94Q3

targets:
  YouTubePlayer:
    type: application
    platform: iOS
    sources:
      - path: YouTubePlayer
        type: group
    info:
      path: YouTubePlayer/Info.plist
      properties:
        CFBundleDisplayName: MyTube Player
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: launchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        MinimumOSVersion: "17.0"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlopascoli.mytubeplayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: YES

  YouTubePlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YouTubePlayerUITests
    dependencies:
      - target: YouTubePlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlopascoli.mytubeplayer.uitests
        TEST_TARGET_NAME: YouTubePlayer
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  YouTubePlayer:
    build:
      targets:
        YouTubePlayer: all
        YouTubePlayerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YouTubePlayerUITests
