name: Walkman
options:
  bundleIdPrefix: com.carlopascoli
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    exactVersion: 0.4.9

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7DZ8FR94Q3

targets:
  Walkman:
    type: application
    platform: iOS
    sources:
      - path: Walkman
        type: group
    info:
      path: Walkman/Info.plist
      properties:
        CFBundleDisplayName: Walkman
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: launchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        MinimumOSVersion: "17.0"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlopascoli.walkman
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: YES

  WalkmanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WalkmanTests
    dependencies:
      - target: Walkman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlopascoli.walkman.tests
        TEST_TARGET_NAME: Walkman
        GENERATE_INFOPLIST_FILE: "YES"

  WalkmanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WalkmanUITests
    dependencies:
      - target: Walkman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlopascoli.walkman.uitests
        TEST_TARGET_NAME: Walkman
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Walkman:
    build:
      targets:
        Walkman: all
        WalkmanTests: [test]
        WalkmanUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkmanTests
        - WalkmanUITests
